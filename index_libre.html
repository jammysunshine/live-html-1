<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Speech Translation (LibreTranslate)</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        #startButton {
            padding: 1rem 2rem;
            font-size: 1.5rem;
            cursor: pointer;
        }
        .text-container {
            width: 80%;
            max-width: 600px;
            margin-top: 2rem;
            border: 1px solid #ccc;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <button id="startButton">Start Session</button>
    <div class="controls">
        <label for="language">Speak in:</label>
        <select id="language">
            <option value="es-ES">Spanish</option>
            <option value="fr-FR">French</option>
            <option value="de-DE">German</option>
            <option value="it-IT">Italian</option>
            <option value="pt-PT">Portuguese</option>
            <option value="ru-RU">Russian</option>
            <option value="ja-JP">Japanese</option>
            <option value="ko-KR">Korean</option>
            <option value="zh-CN">Chinese (Simplified)</option>
            <option value="hi-IN" selected>Hindi</option>
            <option value="ur-IN">Urdu (India)</option>
            <option value="ur-PK">Urdu (Pakistan)</option>
        </select>
    </div>
    <div class="text-container">
        <h2>Original Text:</h2>
        <p id="originalText"></p>
    </div>
    <div class="text-container">
        <h2>Translated Text (to English):</h2>
        <p id="translatedText"></p>
    </div>

    <script>
        const startButton = document.getElementById('startButton');
        const originalText = document.getElementById('originalText');
        const translatedText = document.getElementById('translatedText');
        const languageSelect = document.getElementById('language');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition;
        let listening = false;

        if (SpeechRecognition) {
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;

            languageSelect.addEventListener('change', () => {
                if (listening) {
                    recognition.stop();
                    recognition.start();
                }
            });

            startButton.addEventListener('click', () => {
                listening = !listening;
                if (listening) {
                    startButton.textContent = 'Stop Session';
                    recognition.lang = languageSelect.value;
                    originalText.textContent = '';
                    translatedText.textContent = '';
                    recognition.start();
                } else {
                    startButton.textContent = 'Start Session';
                    recognition.stop();
                }
            });

            recognition.onresult = (event) => {
                let full_transcript = '';
                for (let i = 0; i < event.results.length; ++i) {
                    full_transcript += event.results[i][0].transcript;
                }
                originalText.textContent = full_transcript;
                translateAndSpeak(full_transcript);
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
            };

        } else {
            startButton.disabled = true;
            startButton.textContent = 'Speech Recognition not supported';
            alert('Speech Recognition is not supported in this browser. Please try Chrome or Edge.');
        }

        function translateAndSpeak(text) {
            if (!text.trim()) return;
            const sourceLanguage = languageSelect.value.split('-')[0];
            const apiUrl = "https://libretranslate.de/translate";

            // Translate to English
            fetch(apiUrl, {
                method: "POST",
                body: JSON.stringify({
                    q: text,
                    source: sourceLanguage,
                    target: "en"
                }),
                headers: { "Content-Type": "application/json" }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                if (data.translatedText) {
                    translatedText.textContent = data.translatedText;
                } else {
                    translatedText.textContent = "Translation failed (no text).";
                }
            })
            .catch(error => {
                console.error('English translation error:', error);
                translatedText.textContent = `Translation Error: ${error.message}`;
            });
        }
    </script>
</body>
</html>
